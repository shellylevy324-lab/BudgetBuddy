<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build the Amount | Buddy Skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="platform.css?v=3.1.0">
<link rel="stylesheet" href="money-amounts.css?v=3.1.0">
</head>
<body class="platform-page">
<header class="platform-header compact-header"><div class="platform-header-inner"><h1 class="platform-name">Build the Amount</h1><p class="platform-tagline">Practice making amounts, paying, and creating change.</p></div></header>
<main class="amount-shell">
<section id="setupScreen" class="amount-card setup-card"><p class="eyebrow">Assigned Activity</p><h2 id="studentWelcome">Ready to practice money?</h2><p id="levelDescription">Build the amount using coins and bills.</p><button id="startSession" class="platform-button platform-button-full" type="button">Start Build the Amount</button><a class="text-link" href="training-station.html?v=3.1.0">← Back to My Activities</a></section>
<section id="trialScreen" class="amount-card" hidden>
<div class="trial-top"><strong id="trialProgress">Trial 1 of 8</strong><span id="promptStatus" class="prompt-badge">Independent</span></div>
<div class="progress-track"><span id="progressFill"></span></div><div id="amountTokenBoard" class="shared-token-board"></div>
<p id="direction" class="direction">Build this amount.</p>
<div id="taskVisual" class="task-visual"></div>
<div id="amountWorkspace" class="amount-workspace">
<div class="workspace-heading"><span>Your money</span><strong id="selectedTotal">$0.00</strong></div>
<div id="selectedMoney" class="selected-money" aria-live="polite"><p class="empty-tray">Choose money below.</p></div>
</div>
<div id="denominationBank" class="denomination-bank" aria-label="Money choices"></div>
<div class="workspace-actions"><button id="undoMoney" class="teacher-secondary-button" type="button">Undo</button><button id="clearMoney" class="teacher-secondary-button" type="button">Clear</button><button id="checkAnswer" class="platform-button" type="button">Check</button></div>
<p id="feedback" class="feedback" aria-live="assertive"></p><button id="endEarly" class="end-button" type="button">End Session</button>
</section>
<section id="summaryScreen" class="amount-card summary-card" hidden><div id="amountCompletion"></div><button id="returnToActivities" class="platform-button platform-button-full" type="button">Back to My Activities</button></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="skill-registry.js?v=3.1.0"></script><script src="skill-framework.js?v=3.1.0"></script><script src="session-engine.js?v=3.1.0"></script><script src="money-amounts.js?v=3.1.0"></script>
</body></html>
