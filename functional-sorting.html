<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Functional Sorting | Buddy Skills</title><link rel="stylesheet" href="functional-sorting.css"></head><body><main><header><a href="training-station.html">← Training Station</a><h1>Functional Sorting</h1><p>Growing Skills. Building Independence.</p></header><section id="setup"><h2>Teacher setup</h2><label>Sorting activity <select id="mode"><option value="food">Food / Not Food</option><option value="store">Grocery / Other Store</option></select></label><label>Number of trials <select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></label><label><input type="checkbox" id="audio"> Speak instructions</label><label><input type="checkbox" id="feedback" checked> Show corrective feedback</label><button id="start">Start session</button><p class="hint">Pilot: uses only product photographs already in your catalog. Session data stays in this browser until exported.</p></section><section id="game" hidden><div class="top"><strong id="progress"></strong><button id="speak">🔊 Repeat instruction</button><button id="end">End session</button></div><p id="instruction" aria-live="polite">Where does this go?</p><div class="product"><img id="photo" alt=""><h2 id="productName"></h2></div><div id="bins" class="bins"></div><p id="feedbackText" role="status" aria-live="polite"></p><button id="next" hidden>Next item →</button></section><section id="summary" hidden><h2>Session summary</h2><div id="stats"></div><button id="download">Download trial data (CSV)</button><button id="again">New session</button><table><thead><tr><th>Item</th><th>Choice</th><th>Correct?</th><th>Latency (s)</th></tr></thead><tbody id="rows"></tbody></table></section></main><script src="functional-sorting.js"></script></body></html>
